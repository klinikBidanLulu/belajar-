<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Pertamaku</title>
  
  <!-- Memanggil Tailwind CSS lewat CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <!-- Header / Navigasi Atas -->
  <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center">
    <div class="text-xl font-bold text-blue-600">
      Klinikku<span class="text-slate-800">Medika</span>
    </div>

    <nav class="space-x-6 hidden md:block">
      <a href="#" class="hover:text-blue-600">Layanan</a>
      <a href="#" class="hover:text-blue-600">Dokter</a>
      <a href="#" class="hover:text-blue-600">Kontak</a>
    </nav>
  </header>
  
<!-- 1. HALAMAN UTAMA / HERO SECTION -->
  <div id="heroSection">
    <main class="max-w-4xl mx-auto text-center py-20 px-4">
      <h1 class="text-4xl font-extrabold text-slate-900 mb-4">
        Layanan Kesehatan Terbaik untuk Keluarga Anda
      </h1>

      <p class="text-lg text-slate-600 mb-8">
        Kami hadir memberikan pelayanan medis modern, nyaman, dan ramah.
      </p>

      <!-- Tombol Pemicu -->
      <a id="btnJanji" href="#" class="inline-block px-8 py-4 bg-blue-600 text-white font-semibold rounded-full hover:bg-blue-700 shadow-lg transition-all">
        Buat Janji Temu
      </a>
    </main>
  </div>


  <!-- 2. HALAMAN FORMULIR (Awalnya disembunyikan pakai kelas "hidden") -->
  <div id="formSection" class="hidden max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg my-12">
    <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Isi Data Janji Temu</h2>
    
    <form id="formJanji" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
        <input type="text" id="inputNama" required 
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" 
               placeholder="Contoh: Budi Santoso">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nomor WhatsApp</label>
        <input type="tel" id="inputTelepon" required 
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" 
               placeholder="Contoh: 08123456789">
      </div>

      <button type="submit" class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition shadow-md">
        Kirim Pendaftaran
      </button>
    </form>
  </div>

  <script>
  const btnJanji = document.getElementById('btnJanji');
  const heroSection = document.getElementById('heroSection');
  const formSection = document.getElementById('formSection');

  btnJanji.addEventListener('click', function(event) {
    event.preventDefault(); // Mencegah link melompat

    // 1. Sembunyikan halaman utama
    heroSection.classList.add('hidden');

    // 2. Munculkan halaman formulir
    formSection.classList.remove('hidden');

    // 3. Otomatis bawa layar ke paling atas agar terasa seperti halaman baru
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
  
</body>
</html>
